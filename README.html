<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake 10x10 - Manba V2 Native</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 5px; color: #4CAF50; }
        .score { font-size: 1.2rem; margin-bottom: 15px; }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 35px);
            grid-template-rows: repeat(10, 35px);
            gap: 4px;
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .cell {
            width: 35px;
            height: 35px;
            background-color: #2a2a2a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .snake-head { background-color: #4CAF50; border-radius: 6px; }
        .snake-body { background-color: #81C784; border-radius: 4px; }
        .food { background-color: #FF5252; border-radius: 50%; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background-color: #555; }
        .status { margin-top: 15px; font-weight: bold; color: #FFD54F; }
    </style>
</head>
<body>

    <h1>🐍 Snake 10x10</h1>
    <div class="score" id="score">Puntos: 0</div>
    <div class="board" id="board"></div>
    <div class="status" id="status">Mueve el Joystick Izquierdo de tu Manba V2</div>

    <div class="controls">
        <button onclick="guardarPartidaCSV()">💾 Guardar CSV</button>
        <button onclick="cargarPartidaCSV()">📂 Cargar CSV</button>
        <button onclick="reiniciarJuego()">🔄 Nueva Partida</button>
    </div>

    <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="procesarArchivoCSV(event)">

    <script>
        let matriz = Array(10).fill().map(() => Array(10).fill(0));
        let gameOver = false;
        let lastAxisTime = 0;

        function inicializarJuego() {
            matriz = Array(10).fill().map(() => Array(10).fill(0));
            matriz[5][5] = 1;
            matriz[5][4] = 2;
            matriz[5][3] = 3;
            colocarComida();
            gameOver = false;
            document.getElementById('status').innerText = "🕹️ Mueve el Joystick Izquierdo para jugar";
            renderizar();
        }

        function colocarComida() {
            let vacias = [];
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    if (matriz[r][c] === 0) vacias.push({r, c});
                }
            }
            if (vacias.length > 0) {
                let spot = vacias[Math.floor(Math.random() * vacias.length)];
                matriz[spot.r][spot.c] = -1;
            }
        }

        function obtenerPuntaje() {
            let count = 0;
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    if (matriz[r][c] > 0) count++;
                }
            }
            return count - 3;
        }

        function renderizar() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            document.getElementById('score').innerText = `Puntos: ${obtenerPuntaje()}`;

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    let val = matriz[r][c];
                    if (val === 1) cell.classList.add('snake-head');
                    else if (val > 1) cell.classList.add('snake-body');
                    else if (val === -1) cell.classList.add('food');
                    board.appendChild(cell);
                }
            }
        }

        function mover(direccion) {
            if (gameOver) return;

            let hr = -1, hc = -1;
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    if (matriz[r][c] === 1) { hr = r; hc = c; break; }
                }
            }

            let dr = 0, dc = 0;
            if (direccion === 'W') dr = -1;
            else if (direccion === 'S') dr = 1;
            else if (direccion === 'A') dc = -1;
            else if (direccion === 'D') dc = 1;

            let nr = hr + dr, nc = hc + dc;

            if (nr < 0 || nr >= 10 || nc < 0 || nc >= 10 || matriz[nr][nc] > 0) {
                gameOver = true;
                vibrarMando('crash');
                document.getElementById('status').innerText = "💥 ¡Fin del juego! Chocaste.";
                return;
            }

            let comio = (matriz[nr][nc] === -1);

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    if (matriz[r][c] > 0) matriz[r][c]++;
                }
            }

            if (!comio) {
                let maxVal = 0, tr = -1, tc = -1;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 10; c++) {
                        if (matriz[r][c] > maxVal) {
                            maxVal = matriz[r][c];
                            tr = r; tc = c;
                        }
                    }
                }
                if (tr !== -1) matriz[tr][tc] = 0;
            } else {
                colocarComida();
                vibrarMando('eat');
            }

            matriz[nr][nc] = 1;
            renderizar();
        }

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let g of gamepads) { if (g) { gp = g; break; } }

            if (gp) {
                const now = Date.now();
                if (now - lastAxisTime > 220) {
                    const axisX = gp.axes[0];
                    const axisY = gp.axes[1];

                    if (axisY < -0.5) { mover('W'); lastAxisTime = now; }
                    else if (axisY > 0.5) { mover('S'); lastAxisTime = now; }
                    else if (axisX < -0.5) { mover('A'); lastAxisTime = now; }
                    else if (axisX > 0.5) { mover('D'); lastAxisTime = now; }
                }
            }
            requestAnimationFrame(pollGamepad);
        }

        function vibrarMando(tipo) {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let gp of gamepads) {
                if (gp && gp.vibrationActuator) {
                    if (tipo === 'eat') {
                        gp.vibrationActuator.playEffect("dual-rumble", {
                            startDelay: 0, duration: 150, weakMagnitude: 0.7, strongMagnitude: 0.1
                        });
                    } else if (tipo === 'crash') {
                        gp.vibrationActuator.playEffect("dual-rumble", {
                            startDelay: 0, duration: 500, weakMagnitude: 1.0, strongMagnitude: 1.0
                        });
                    }
                }
            }
        }

        function guardarPartidaCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            matriz.forEach(row => {
                csvContent += row.join(",") + "\r\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "partida.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function cargarPartidaCSV() {
            document.getElementById('csvInput').click();
        }

        function procesarArchivoCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.trim().split('\n');
                if (lines.length === 10) {
                    matriz = lines.map(line => line.split(',').map(Number));
                    gameOver = false;
                    renderizar();
                    document.getElementById('status').innerText = "📂 Partida cargada con éxito.";
                }
            };
            reader.readAsText(file);
        }

        function reiniciarJuego() { inicializarJuego(); }

        window.addEventListener("gamepadconnected", () => {
            document.getElementById('status').innerText = "🎮 ¡Manba V2 Conectado! Usa el Joystick Izquierdo";
        });
        window.addEventListener("keydown", (e) => {
            if (e.key === 'w' || e.key === 'W') mover('W');
            if (e.key === 's' || e.key === 'S') mover('S');
            if (e.key === 'a' || e.key === 'A') mover('A');
            if (e.key === 'd' || e.key === 'D') mover('D');
        });

        inicializarJuego();
        requestAnimationFrame(pollGamepad);
    </script>
</body>
</html>
